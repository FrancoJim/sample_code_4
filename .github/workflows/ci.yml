name: CI

on:
  push:
    branches: [main]
    paths:
      - "microservice/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "microservice/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: microservice/src/requirements.txt

      - name: Install dependencies
        run: pip install -r microservice/src/requirements.txt

      - name: Run tests
        run: python -m pytest microservice/src/test_app.py -v

  build-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # Only push on commits to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sample_code_4
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
