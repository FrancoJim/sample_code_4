name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: microservice/src/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r microservice/src/requirements-dev.txt

      - name: Lint
        run: |
          ruff check --config microservice/ruff.toml microservice/src
          ruff format --config microservice/ruff.toml --check microservice/src

      - name: Test
        working-directory: microservice/src
        run: python -m pytest -v --cov=app --cov-report=term-missing test_app.py

  infra:
    name: Terraform, Kubernetes, shell + Dockerfile checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Static checks only: no cloud credentials, nothing is planned or applied
      - run: make tf-check
      - run: make k8s-check
      - run: make shellcheck
      - run: make hadolint

  image:
    name: Build, smoke test & push image
    needs: [app, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Publish only on pushes to main, and only once Docker Hub secrets are configured
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t weather-service:ci microservice

      - name: Smoke test
        run: |
          docker run -d --name ws -p 5000:5000 --read-only --tmpfs /tmp weather-service:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:5000/health && break; sleep 1; done
          curl -fsS http://localhost:5000/health | grep -q '"ok"'
          docker rm -f ws

      - name: Note skipped publish
        if: env.PUBLISH != 'true' && github.event_name == 'push'
        run: echo "::notice::Image built and smoke-tested; not pushed because DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set."

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sample_code_4
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./microservice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
